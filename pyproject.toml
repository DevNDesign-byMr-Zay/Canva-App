[project]
name = "canva-legacy-archive-verifier"
version = "1.0.0"
description = "Typed integrity and deidentification verifier for the curated Canva application source archive"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "coverage>=7.16,<8",
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pip-audit>=2.10,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["archive_verifier", "scripts"]
omit = ["scripts/verify_python_lock.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["archive_verifier", "scripts"]
