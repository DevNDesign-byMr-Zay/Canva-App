services:
  depthpop:
    build:
      context: ./apps/depthpop-canva/backend
      dockerfile: Dockerfile
    image: canva-depthpop:production
    restart: unless-stopped
    ports:
      - "${DEPTHPOP_PORT:-8081}:8081"
    environment:
      ENVIRONMENT: production
      CANVA_APP_ID: "${DEPTHPOP_CANVA_APP_ID:?DEPTHPOP_CANVA_APP_ID is required}"
      CANVA_APP_ORIGIN: "${DEPTHPOP_CANVA_APP_ORIGIN:?DEPTHPOP_CANVA_APP_ORIGIN is required}"
      PUBLIC_BASE_URL: "${DEPTHPOP_PUBLIC_BASE_URL:?DEPTHPOP_PUBLIC_BASE_URL is required}"
      FAL_KEY: "${FAL_KEY:?FAL_KEY is required}"
      SEGMENTATION_PROVIDER: "${SEGMENTATION_PROVIDER:-auto}"
      DEPTH_PROVIDER: "${DEPTH_PROVIDER:-auto}"
      INPAINT_PROVIDER: "${INPAINT_PROVIDER:-auto}"
      DEPTHPOP_ALLOW_BBOX_FALLBACK: "false"
      DEPTHPOP_REPOSITORY_BACKEND: sqlite
      DEPTHPOP_DATABASE_PATH: /data/depthpop/depthpop.sqlite3
      DEPTHPOP_ASSET_ROOT: /data/depthpop/assets
      DEPTHPOP_ARTIFACT_ROOT: /data/depthpop/artifacts
      DEPTHPOP_MAX_EXPORT_CONCURRENCY: "${DEPTHPOP_MAX_EXPORT_CONCURRENCY:-2}"
      DEPTHPOP_MAX_EXPORT_PIXELS: "${DEPTHPOP_MAX_EXPORT_PIXELS:-16777216}"
      DEPTHPOP_MAX_EXPORT_FRAMES: "${DEPTHPOP_MAX_EXPORT_FRAMES:-3600}"
      DEPTHPOP_MAX_EXPORT_DURATION_MS: "${DEPTHPOP_MAX_EXPORT_DURATION_MS:-120000}"
      DEPTHPOP_MAX_EXPORT_ARTIFACT_BYTES: "${DEPTHPOP_MAX_EXPORT_ARTIFACT_BYTES:-536870912}"
    volumes:
      - depthpop-data:/data/depthpop
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  holoforge:
    build:
      context: ./apps/holoforge-canva/backend
      dockerfile: Dockerfile.render
      args:
        BLENDER_VERSION: "${HOLOFORGE_BLENDER_VERSION:-4.5.14}"
    image: canva-holoforge:production
    restart: unless-stopped
    ports:
      - "${HOLOFORGE_PORT:-8082}:8082"
    environment:
      ENVIRONMENT: production
      CANVA_APP_ID: "${HOLOFORGE_CANVA_APP_ID:?HOLOFORGE_CANVA_APP_ID is required}"
      CANVA_APP_ORIGIN: "${HOLOFORGE_CANVA_APP_ORIGIN:?HOLOFORGE_CANVA_APP_ORIGIN is required}"
      PUBLIC_BASE_URL: "${HOLOFORGE_PUBLIC_BASE_URL:?HOLOFORGE_PUBLIC_BASE_URL is required}"
      BLENDER_BIN: /opt/blender/blender
      HOLOFORGE_BLENDER_VERSION: "${HOLOFORGE_BLENDER_VERSION:-4.5.14}"
      HOLOFORGE_REPOSITORY_BACKEND: sqlite
      HOLOFORGE_DATABASE_PATH: /data/holoforge/holoforge.sqlite3
      HOLOFORGE_ARTIFACT_ROOT: /data/holoforge/artifacts
      HOLOFORGE_RENDER_TIMEOUT_SECONDS: "${HOLOFORGE_RENDER_TIMEOUT_SECONDS:-600}"
      HOLOFORGE_MAX_CONCURRENCY: "${HOLOFORGE_MAX_CONCURRENCY:-2}"
      HOLOFORGE_MAX_JOBS: "${HOLOFORGE_MAX_JOBS:-256}"
      HOLOFORGE_MAX_ARTIFACTS: "${HOLOFORGE_MAX_ARTIFACTS:-128}"
      HOLOFORGE_JOB_TTL_SECONDS: "${HOLOFORGE_JOB_TTL_SECONDS:-3600}"
      HOLOFORGE_ARTIFACT_TTL_SECONDS: "${HOLOFORGE_ARTIFACT_TTL_SECONDS:-86400}"
    volumes:
      - holoforge-data:/data/holoforge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8082/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  depthpop-data:
  holoforge-data:
