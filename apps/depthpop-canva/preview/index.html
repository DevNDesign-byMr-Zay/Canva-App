dding:12px;text-align:center;border-radius:999px;border:1px solid rgba(168,85,247,.3);background:radial-gradient(120% 220% at 20% 0,rgba(168,85,247,.4),rgba(168,85,247,.16) 35%,rgba(255,255,255,.05) 100%);font-size:9.5px;font-weight:820;letter-spacing:.18em}
