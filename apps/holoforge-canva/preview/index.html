<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoloForge Canva UI Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;background:#16171c;color:#f7f9ff;font-family:Inter,Arial,sans-serif;padding:28px}.app{width:350px;padding:16px;background:radial-gradient(260px 180px at 82% -3%,rgba(156,115,255,.18),transparent 70%),linear-gradient(#08090e,#030407 64%);border-radius:24px}.hero,.panel{border:1px solid rgba(255,255,255,.1);background:rgba(16,18,25,.78);border-radius:22px}.hero{padding:16px;position:relative}.k{font-size:8px;color:#9399aa;letter-spacing:.18em;font-weight:800}.hero h1{margin:7px 0 5px;font-size:24px;letter-spacing:.14em}.hero p{margin:0;color:#aeb4c1;font-size:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tabs span{padding:10px 5px;text-align:center;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#9299aa;font-size:9px;font-weight:800}.tabs .on{color:#fff;border-color:rgba(99,239,255,.35);background:linear-gradient(135deg,rgba(99,239,255,.1),rgba(156,115,255,.12))}.panel{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.card{height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;color:#b8becb;font-size:9px}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.mat{height:55px;border-radius:12px;background:linear-gradient(125deg,#5af0ff,#9d70ff,#ff72c7,#ffd36b);border:1px solid rgba(255,255,255,.16)}.mat:nth-child(2){background:linear-gradient(125deg,#dff8ff,#86d8ff,#c6a6ff,#fff)}.mat:nth-child(3){background:linear-gradient(125deg,#141820,#dbe5ff,#58eaff,#755cff)}.action{margin-top:14px;padding:12px;border-radius:999px;text-align:center;background:linear-gradient(90deg,#6aefff,#9b72ff 55%,#ff77c9);color:#050509;font-size:9px;font-weight:900;letter-spacing:.11em}
</style>
</head>
<body><main class="app"><section class="hero"><div class="k">HOLOGRAPHIC DESIGN STUDIO</div><h1>HOLOFORGE</h1><p>Forge spectral materials into editable Canva design elements.</p></section><div class="tabs"><span class="on">01 CREATE</span><span>02 SPATIAL</span><span>03 VERIFY</span></div><section class="panel"><div class="k">01 · CREATION TYPE</div><div class="grid"><div class="card">Holo Text</div><div class="card">Holo Logo</div><div class="card">Holo Graphic</div><div class="card">Glass</div><div class="card">Chrome</div><div class="card">Light FX</div></div><div class="k" style="margin-top:16px">02 · MATERIAL</div><div class="materials"><div class="mat"></div><div class="mat"></div><div class="mat"></div></div><div class="action">FORGE INTO CANVA</div></section></main></body>
</html>
