<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">DepthPop</title>
  <desc id="desc">Layered depth prism mark</desc>
  <defs>
    <linearGradient id="dpA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55F6FF"/>
      <stop offset="0.45" stop-color="#7B66FF"/>
      <stop offset="1" stop-color="#FF5AD9"/>
    </linearGradient>
    <linearGradient id="dpB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#5AE8FF" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="#05070C"/>
  <path d="M26 33 71 19l31 22-45 14z" fill="url(#dpA)" opacity=".42"/>
  <path d="M22 50 67 36l39 27-45 15z" fill="url(#dpA)" opacity=".62"/>
  <path d="M18 70 63 55l42 29-45 16z" fill="url(#dpA)" opacity=".9" filter="url(#glow)"/>
  <path d="m18 70 42 30 45-16" fill="none" stroke="url(#dpB)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="72" r="10" fill="#05070C" stroke="#EFFFFF" stroke-width="2"/>
  <circle cx="64" cy="72" r="3.5" fill="#55F6FF"/>
</svg>
