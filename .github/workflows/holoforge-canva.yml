name: HoloForge Canva app

on:
  pull_request:
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-ui-package.mjs"
      - "package.json"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-ui-package.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible SDK install
        run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify reviewed development-tool advisory boundary
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 0 ]; then
            echo "Full dependency graph has no moderate-or-higher advisories."
          else
            node scripts/verify-dev-audit.mjs npm-audit.json
          fi
      - name: Type-check Canva app
        run: npm run typecheck
      - name: Test Canva app
        run: npm test
      - name: Measure Canva app Vitest coverage
        run: npm run test:coverage
      - name: Build Canva app
        run: npm run build
      - name: Assemble and audit complete HoloForge + DepthPop UI package
        shell: bash
        run: |
          set -euo pipefail
          node ../scripts/assemble-canva-ui-package.mjs .artifacts/canva-ui
          node --check ../.artifacts/canva-ui/app.js

          for required in \
            app.js \
            app.json \
            canva-app.json \
            messages_en.json \
            START-HERE.html \
            HOLOFORGE.html \
            DEPTHPOP.html \
            UPLOAD-TO-CANVA.txt \
            PACKAGE_CONTENTS.txt \
            PACKAGE_MANIFEST.json \
            preview/index.html \
            preview/styles.css \
            preview/preview.js \
            preview/assets/holoforge-logo.svg \
            preview/assets/depthpop-logo.svg
          do
            test -s "../.artifacts/canva-ui/$required"
          done

          node -e "const fs=require('fs'); for (const p of ['app.json','canva-app.json','messages_en.json','PACKAGE_MANIFEST.json']) JSON.parse(fs.readFileSync('../.artifacts/canva-ui/'+p,'utf8'));"
          cmp ../.artifacts/canva-ui/app.json ../.artifacts/canva-ui/canva-app.json
          grep -q "HoloForge" ../.artifacts/canva-ui/preview/index.html
          grep -q "DepthPop" ../.artifacts/canva-ui/preview/index.html

          if find ../.artifacts/canva-ui -type f -empty -print -quit | grep -q .; then
            echo "Empty file found in Canva UI package" >&2
            find ../.artifacts/canva-ui -type f -empty -print >&2
            exit 1
          fi

          (cd ../.artifacts/canva-ui && zip -qr ../canva-app-ui.zip .)
          unzip -t ../.artifacts/canva-app-ui.zip
      - name: Retain Canva UI package
        uses: actions/upload-artifact@v7
        with:
          name: canva-app-ui-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: .artifacts/canva-app-ui.zip
