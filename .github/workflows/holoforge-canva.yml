name: HoloForge Canva app

on:
  pull_request:
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canva-app/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
