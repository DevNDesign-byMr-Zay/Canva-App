name: HoloForge Canva app

on:
  pull_request:
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-ui-package.mjs"
      - "package.json"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-ui-package.mjs"
      - "package.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible SDK install
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier formatting
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          npm run format
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style(canva): apply Prettier formatting"
            git push origin "HEAD:$HEAD_REF"
            echo "Formatted Canva source pushed to $HEAD_REF. A fresh CI run will verify it."
            exit 1
          fi
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify reviewed development-tool advisory boundary
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 0 ]; then
            echo "Full dependency graph has no moderate-or-higher advisories."
          else
            node scripts/verify-dev-audit.mjs npm-audit.json
          fi
      - name: Type-check Canva app
        run: npm run typecheck
      - name: Test Canva app
        run: npm test
      - name: Measure Canva app Vitest coverage
        run: npm run test:coverage
      - name: Build Canva app
        run: npm run build
      - name: Assemble clean HoloForge + DepthPop UI package
        shell: bash
        run: |
          set -euo pipefail
          node ../scripts/assemble-canva-ui-package.mjs .artifacts/canva-ui
          (cd ../.artifacts/canva-ui && zip -qr ../canva-app-ui.zip .)
      - name: Retain Canva UI package
        uses: actions/upload-artifact@v7
        with:
          name: canva-app-ui-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: .artifacts/canva-app-ui.zip
