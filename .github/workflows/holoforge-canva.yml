name: Canva apps / HoloForge + DepthPop

on:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-apps.mjs"
      - "package.json"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "apps/**"
      - ".github/workflows/holoforge-canva.yml"
      - "scripts/assemble-canva-apps.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/holoforge-canva/package-lock.json
            apps/depthpop-canva/package-lock.json

      - name: Install HoloForge
        run: npm --prefix apps/holoforge-canva ci --ignore-scripts

      - name: Install DepthPop
        run: npm --prefix apps/depthpop-canva ci --ignore-scripts

      - name: Audit HoloForge runtime dependencies
        run: npm --prefix apps/holoforge-canva audit --omit=dev --audit-level=moderate

      - name: Audit DepthPop runtime dependencies
        run: npm --prefix apps/depthpop-canva audit --omit=dev --audit-level=moderate

      - name: Type-check HoloForge
        run: npm --prefix apps/holoforge-canva run typecheck

      - name: Type-check DepthPop
        run: npm --prefix apps/depthpop-canva run typecheck

      - name: Test HoloForge
        run: npm --prefix apps/holoforge-canva test

      - name: Test DepthPop
        run: npm --prefix apps/depthpop-canva test

      - name: Measure HoloForge coverage
        run: npm --prefix apps/holoforge-canva run test:coverage

      - name: Measure DepthPop coverage
        run: npm --prefix apps/depthpop-canva run test:coverage

      - name: Build HoloForge
        run: npm --prefix apps/holoforge-canva run build

      - name: Build DepthPop
        run: npm --prefix apps/depthpop-canva run build

      - name: Assemble two independent Canva packages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-canva-apps.mjs .artifacts/canva-apps

          node --check .artifacts/canva-apps/holoforge/app.js
          node --check .artifacts/canva-apps/depthpop/app.js

          for app in holoforge depthpop; do
            for required in app.js canva-app.json README.md START-HERE.html UPLOAD-TO-CANVA.txt PACKAGE_MANIFEST.json preview/index.html preview/styles.css preview/preview.js; do
              test -s ".artifacts/canva-apps/$app/$required"
            done
            if find ".artifacts/canva-apps/$app" -type f -empty -print -quit | grep -q .; then
              echo "Empty file in $app Canva package" >&2
              exit 1
            fi
          done

          ! grep -Eiq 'DEPTHPOP|DepthPop' .artifacts/canva-apps/holoforge/preview/index.html
          ! grep -Eiq 'HoloForge' .artifacts/canva-apps/depthpop/preview/index.html

          (cd .artifacts/canva-apps/holoforge && zip -qr ../../holoforge-canva-app.zip .)
          (cd .artifacts/canva-apps/depthpop && zip -qr ../../depthpop-canva-app.zip .)
          unzip -t .artifacts/holoforge-canva-app.zip
          unzip -t .artifacts/depthpop-canva-app.zip

      - name: Retain HoloForge Canva app
        uses: actions/upload-artifact@v7
        with:
          name: holoforge-canva-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: .artifacts/holoforge-canva-app.zip

      - name: Retain DepthPop Canva app
        uses: actions/upload-artifact@v7
        with:
          name: depthpop-canva-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: .artifacts/depthpop-canva-app.zip
