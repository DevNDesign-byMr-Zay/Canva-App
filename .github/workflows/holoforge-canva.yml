name: HoloForge Canva app

on:
  pull_request:
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
  push:
    branches:
      - main
      - "mrzay/**"
      - "tara/**"
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
