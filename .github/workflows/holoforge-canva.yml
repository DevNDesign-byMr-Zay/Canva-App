name: HoloForge Canva app

on:
  pull_request:
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "canva-app/**"
      - ".github/workflows/holoforge-canva.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible SDK install
        run: npm ci --ignore-scripts
      - name: Audit SDK dependency graph
        run: npm audit --audit-level=moderate
      - name: Type-check Canva app
        run: npm run typecheck
      - name: Test Canva app
        run: npm test
      - name: Build Canva app
        run: npm run build
