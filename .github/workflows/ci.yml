name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CANVA_CLI_DISABLE_TELEMETRY: "true"

permissions:
  contents: read

jobs:
  root-node-tests:
    name: Root Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible root install
        run: npm ci --ignore-scripts
      - name: Audit root dependencies
        run: npm audit --audit-level=moderate
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Lint maintained JavaScript
        run: npm run lint
      - name: Check maintained JavaScript syntax
        run: npm run verify:syntax
      - name: Run root JavaScript tests
        run: npm test

  python-quality:
    name: Python tests lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked Python toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify Python dependency graph
        run: python -m pip check
      - name: Run Python tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check archive_verifier scripts tests
      - name: Type-check Python
        run: python -m mypy archive_verifier scripts

  design-editor:
    name: Design Editor typecheck test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible Design Editor install
        run: npm ci --ignore-scripts
      - name: Check Design Editor formatting
        run: npm run format:check
      - name: Type-check Design Editor app
        run: npm run typecheck
      - name: Test Design Editor app
        run: npm test
      - name: Retain Design Editor coverage
        uses: actions/upload-artifact@v7
        with:
          name: design-editor-coverage-ci-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: canva-app/coverage/
      - name: Build Design Editor app
        run: npm run build

  fresh-clone:
    name: Zero-cache Node Python and Design Editor verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
      - name: Set up Node.js without cache restoration
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Python without cache restoration
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Clone and verify with isolated dependency caches
        shell: bash
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/canva-empty-npm-cache
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git clone --no-local . "$RUNNER_TEMP/canva-fresh"
          cd "$RUNNER_TEMP/canva-fresh"
          test "$(git rev-parse HEAD)" = "$candidate"
          test ! -d node_modules
          test ! -d canva-app/node_modules
          test ! -d "$NPM_CONFIG_CACHE"
          python -m venv "$RUNNER_TEMP/canva-fresh-venv"
          source "$RUNNER_TEMP/canva-fresh-venv/bin/activate"
          {
            printf 'Verified candidate: %s\n' "$candidate"
            node --version
            python --version
            make verify-fresh
            python scripts/materialize_v115.py
            python -m archive_verifier.provenance_integrity
            python -m archive_verifier.runtime_contract
            git diff --exit-code -- app/authenticated-v115
          } 2>&1 | tee "$RUNNER_TEMP/fresh-verification.log"
      - name: Retain zero-cache verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/fresh-verification.log
            ${{ runner.temp }}/canva-fresh/canva-app/coverage/
