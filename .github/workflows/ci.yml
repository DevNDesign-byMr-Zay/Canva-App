name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root-node-test:
    name: root-node-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible root install
        run: npm ci --ignore-scripts
      - name: Audit root dependencies
        run: npm audit --audit-level=moderate
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Check maintained JavaScript syntax
        run: npm run verify:syntax
      - name: Lint root JS
        run: npm run lint
      - name: Run root JavaScript tests
        run: npm test

  root-node-coverage:
    name: root-node-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible root install
        run: npm ci --ignore-scripts
      - name: Run root Node tests with blocking coverage
        run: npm test

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked Python toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify Python dependency graph
        run: python -m pip check
      - name: Run Python tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check archive_verifier scripts tests
      - name: Type-check Python
        run: python -m mypy archive_verifier scripts

  python-coverage:
    name: python-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked Python toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Run Python coverage report
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=90

  design-editor-typecheck:
    name: design-editor-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible Design Editor install
        run: npm ci --ignore-scripts
      - name: Check Design Editor formatting and linting
        run: npm run lint
      - name: Type-check Design Editor app
        run: npm run typecheck

  design-editor-test:
    name: design-editor-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible Design Editor install
        run: npm ci --ignore-scripts
      - name: Test Design Editor app
        run: npm test

  design-editor-coverage:
    name: design-editor-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible Design Editor install
        run: npm ci --ignore-scripts
      - name: Measure Design Editor Vitest coverage
        run: npm run test:coverage

  design-editor-build:
    name: design-editor-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible Design Editor install
        run: npm ci --ignore-scripts
      - name: Build Design Editor app
        run: npm run build

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Audit root dependencies
        run: npm audit --audit-level=moderate
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked Python toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Audit root locked Python vulnerabilities
        run: python -m pip_audit --no-deps --disable-pip -r requirements.lock.txt

  app-backend-dependency-audit:
    name: audit-${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        app: [holoforge-canva, depthpop-canva]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit locked production Canva app dependencies
        run: npm audit --prefix apps/${{ matrix.app }} --omit=dev --audit-level=high
      - name: Audit development dependencies against the narrow vendor boundary
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          trap 'rm -f npm-audit.json' EXIT
          npm audit --json > npm-audit.json || audit_status=$?
          node ../../canva-app/scripts/verify-dev-audit.mjs npm-audit.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python security auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit full locked backend Python dependency graph
        run: python -m pip_audit --no-deps --disable-pip -r apps/${{ matrix.app }}/backend/requirements.lock.txt

  fresh-clone-smoke:
    name: fresh-clone-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Verify both independent applications from committed locks
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/verify-fresh-clone.mjs --standalone
      - name: Root Node locked install
        run: npm ci --ignore-scripts
      - name: Python locked install
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Python pip check
        run: python -m pip check
      - name: Design Editor npm ci
        run: npm --prefix canva-app ci --ignore-scripts
      - name: Root release readiness
        run: npm run verify:release
      - name: Maintained JS syntax check
        run: npm run verify:syntax
      - name: Root Node tests and coverage
        run: npm test
      - name: Python Ruff lint
        run: python -m ruff check archive_verifier scripts tests
      - name: Python mypy typecheck
        run: python -m mypy archive_verifier scripts
      - name: Python pytest and coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=90
      - name: Design Editor lint
        run: npm --prefix canva-app run lint
      - name: Design Editor typecheck
        run: npm --prefix canva-app run typecheck
      - name: Design Editor test
        run: npm --prefix canva-app test
      - name: Design Editor coverage
        run: npm --prefix canva-app run test:coverage
      - name: Design Editor build
        run: npm --prefix canva-app run build
      - name: Authenticated archive verification
        run: python -m archive_verifier

  deployment-readiness:
    name: deployment-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible root install
        run: npm ci --ignore-scripts
      - name: Run deterministic deployment readiness fixture
        run: npm run deployment:check:ci
      - name: Run deployment readiness negative-path tests
        run: node --test tests/js/deployment-readiness.test.mjs
      - name: Validate production Compose contract
        env:
          DEPTHPOP_CANVA_APP_ID: ci-depthpop
          DEPTHPOP_CANVA_APP_ORIGIN: https://app-ci-depthpop.canva-apps.com
          DEPTHPOP_PUBLIC_BASE_URL: https://depthpop.invalid.example
          HOLOFORGE_CANVA_APP_ID: ci-holoforge
          HOLOFORGE_CANVA_APP_ORIGIN: https://app-ci-holoforge.canva-apps.com
          HOLOFORGE_PUBLIC_BASE_URL: https://holoforge.invalid.example
          FAL_KEY: ci-placeholder-not-a-real-secret
        run: docker compose -f docker-compose.production.yml config --quiet

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build and verify container
        run: docker compose up --build verifier
