name: UI extraction readiness
on:
  pull_request:
    paths:
      - '.github/workflows/ui-extraction-readiness.yml'
permissions:
  contents: read
jobs:
  formatted-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: holoforge-canva
            component: studio-panels
          - app: depthpop-canva
            component: depthpop-setup
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install committed app lock
        working-directory: apps/${{ matrix.app }}
        run: npm ci --ignore-scripts
      - name: Format extracted UI and regression tests with locked Prettier
        working-directory: apps/${{ matrix.app }}
        run: >-
          npm exec --no -- prettier --write
          src/intents/design_editor/app.tsx
          src/intents/design_editor/${{ matrix.component }}.tsx
          src/intents/design_editor/${{ matrix.component }}.test.tsx
      - name: Lint and typecheck candidate
        working-directory: apps/${{ matrix.app }}
        run: |
          npm run lint
          npm run typecheck
      - name: Run full-source coverage and interaction regressions
        working-directory: apps/${{ matrix.app }}
        run: npm run test:coverage
      - name: Build candidate
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formatted-ui-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/src/intents/design_editor/app.tsx
            apps/${{ matrix.app }}/src/intents/design_editor/${{ matrix.component }}.tsx
            apps/${{ matrix.app }}/src/intents/design_editor/${{ matrix.component }}.test.tsx
          retention-days: 1
