name: repair/design-editor-format

on:
  push:
    branches:
      - mrzay/design-editor-format-gate-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Install Design Editor dependencies
        run: npm --prefix canva-app ci --ignore-scripts
      - name: Apply pinned Prettier baseline
        run: npm --prefix canva-app run format
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- canva-app/src; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canva-app/src
          git commit -m "style(app): apply Prettier baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
