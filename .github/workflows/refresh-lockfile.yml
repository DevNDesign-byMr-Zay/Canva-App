name: Refresh Python lockfile

on:
  push:
    branches: ["main"]
    paths:
      - "requirements-dev.txt"
      - "requirements.txt"
      - ".github/workflows/refresh-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canva-python-lock-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip freeze > requirements.lock.txt
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- requirements.lock.txt; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          git commit -m "build: refresh Python lockfile"
          git pull --rebase origin main
          git push origin HEAD:main
