name: HoloForge Render Image

on:
  workflow_dispatch:
    inputs:
      blender_version:
        description: Blender 4.5 LTS patch to build
        required: false
        default: "4.5.14"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/holoforge-canva/backend
    steps:
      - uses: actions/checkout@v7
      - name: Build production render image
        run: |
          docker build             --file Dockerfile.render             --build-arg BLENDER_VERSION="${{ inputs.blender_version }}"             --tag holoforge-render:smoke             .
      - name: Verify Blender version
        run: |
          docker run --rm holoforge-render:smoke             /opt/blender/blender --background --version
      - name: Generate real GLB smoke artifact
        run: |
          docker run --rm holoforge-render:smoke             python render_smoke.py
      - name: Start API with Blender available
        run: |
          docker run -d --rm             --name holoforge-render-api             -p 18082:8082             holoforge-render:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/health > /tmp/holoforge-render-health.json; then
              cat /tmp/holoforge-render-health.json
              grep -q '"glb"' /tmp/holoforge-render-health.json
              grep -q '"gltf"' /tmp/holoforge-render-health.json
              grep -q '"mp4"' /tmp/holoforge-render-health.json
              grep -q '"png-sequence"' /tmp/holoforge-render-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs holoforge-render-api
          exit 1
      - name: Stop render API
        if: always()
        run: docker stop holoforge-render-api || true
