name: release/github

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v1.1.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Normalize and validate requested tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$REQUESTED_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "$normalized" != "$expected" ]; then
            echo "Requested tag must equal $expected" >&2
            exit 1
          fi
          if git rev-parse "$normalized" >/dev/null 2>&1; then
            echo "Tag already exists: $normalized" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

      - name: Verify complete application release candidate
        run: make verify-fresh

      - name: Verify container path
        run: docker build --tag canva-release-candidate:${{ github.sha }} .

      - name: Assemble complete Canva UI distribution
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-canva-ui-package.mjs .artifacts/canva-ui
          node --check .artifacts/canva-ui/app.js

          for required in \
            app.js \
            app.json \
            canva-app.json \
            messages_en.json \
            START-HERE.html \
            HOLOFORGE.html \
            DEPTHPOP.html \
            UPLOAD-TO-CANVA.txt \
            PACKAGE_CONTENTS.txt \
            PACKAGE_MANIFEST.json \
            preview/index.html \
            preview/styles.css \
            preview/preview.js \
            preview/assets/holoforge-logo.svg \
            preview/assets/depthpop-logo.svg
          do
            test -s ".artifacts/canva-ui/$required"
          done

          node -e "const fs=require('fs'); for (const p of ['app.json','canva-app.json','messages_en.json','PACKAGE_MANIFEST.json']) JSON.parse(fs.readFileSync('.artifacts/canva-ui/'+p,'utf8'));"
          cmp .artifacts/canva-ui/app.json .artifacts/canva-ui/canva-app.json
          grep -q "HoloForge" .artifacts/canva-ui/preview/index.html
          grep -q "DepthPop" .artifacts/canva-ui/preview/index.html

          if find .artifacts/canva-ui -type f -empty -print -quit | grep -q .; then
            echo "Empty file found in Canva UI distribution" >&2
            find .artifacts/canva-ui -type f -empty -print >&2
            exit 1
          fi

          for product in holoforge depthpop
          do
            product_dir=".artifacts/canva-ui/products/$product"
            for required in \
              app.js \
              app.json \
              canva-app.json \
              messages_en.json \
              app.html \
              index.html \
              ui.json \
              README.md \
              UPLOAD-TO-CANVA.txt \
              PACKAGE_MANIFEST.json \
              styles.css \
              preview.js \
              assets/holoforge-logo.svg \
              assets/depthpop-logo.svg
            do
              test -s "$product_dir/$required"
            done
            node -e "const fs=require('fs'); const d=process.argv[1]; for (const p of ['app.json','canva-app.json','messages_en.json','ui.json','PACKAGE_MANIFEST.json']) JSON.parse(fs.readFileSync(d+'/'+p,'utf8'));" "$product_dir"
          done

          grep -q 'globalThis.__MRZAY_CANVA_PRODUCT__ = "holoforge";' .artifacts/canva-ui/products/holoforge/app.js
          grep -q 'globalThis.__MRZAY_CANVA_PRODUCT__ = "depthpop";' .artifacts/canva-ui/products/depthpop/app.js
          grep -q "HoloForge" .artifacts/canva-ui/products/holoforge/app.html
          grep -q "DepthPop" .artifacts/canva-ui/products/depthpop/app.html

          (cd .artifacts/canva-ui && zip -qr ../canva-app-ui.zip .)
          (cd .artifacts/canva-ui/products/holoforge && zip -qr ../../../holoforge-canva-app.zip .)
          (cd .artifacts/canva-ui/products/depthpop && zip -qr ../../../depthpop-canva-app.zip .)

          unzip -t .artifacts/canva-app-ui.zip
          unzip -t .artifacts/holoforge-canva-app.zip
          unzip -t .artifacts/depthpop-canva-app.zip
          unzip -Z1 .artifacts/canva-app-ui.zip > .artifacts/canva-app-ui-files.txt

          if grep -Eiq '(^|/)(authenticated-v115|legacy-html|provenance|archive_verifier)(/|$)|sbom|release-manifest' .artifacts/canva-app-ui-files.txt; then
            echo "Historical/internal files leaked into Canva UI distribution" >&2
            cat .artifacts/canva-app-ui-files.txt >&2
            exit 1
          fi

          grep -Eq '^app\.js$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^app\.json$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^canva-app\.json$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^messages_en\.json$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^START-HERE\.html$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^HOLOFORGE\.html$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^DEPTHPOP\.html$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^UPLOAD-TO-CANVA\.txt$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^preview/index\.html$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^PACKAGE_CONTENTS\.txt$' .artifacts/canva-app-ui-files.txt
          grep -Eq '^PACKAGE_MANIFEST\.json$' .artifacts/canva-app-ui-files.txt

          if grep -Eq '^app/' .artifacts/canva-app-ui-files.txt; then
            echo "app.js must remain at the ZIP root, not under app/" >&2
            exit 1
          fi

      - name: Retain clean Canva UI distributions
        uses: actions/upload-artifact@v7
        with:
          name: canva-app-ui-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .artifacts/canva-app-ui.zip
            .artifacts/holoforge-canva-app.zip
            .artifacts/depthpop-canva-app.zip

      - name: Build release evidence bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/create-release-manifest.mjs "${{ steps.release_tag.outputs.tag }}" "$GITHUB_SHA" release-manifest.json
          npm sbom --sbom-format=cyclonedx > root-sbom.cdx.json
          (
            cd canva-app
            npm sbom --sbom-format=cyclonedx
          ) > canva-app-sbom.cdx.json
          python -m pip list --format=json > python-dependencies.json
          printf '%s\n' "$GITHUB_SHA" > release-commit.txt
          sha256sum root-sbom.cdx.json canva-app-sbom.cdx.json python-dependencies.json release-commit.txt release-manifest.json .artifacts/canva-app-ui.zip .artifacts/holoforge-canva-app.zip .artifacts/depthpop-canva-app.zip > release-artifacts.sha256

      - name: Verify release evidence checksums
        run: sha256sum --check release-artifacts.sha256

      - name: Retain release evidence before publication
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            root-sbom.cdx.json
            canva-app-sbom.cdx.json
            python-dependencies.json
            release-commit.txt
            release-manifest.json
            release-artifacts.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            .artifacts/canva-app-ui.zip \
            .artifacts/holoforge-canva-app.zip \
            .artifacts/depthpop-canva-app.zip \
            root-sbom.cdx.json \
            canva-app-sbom.cdx.json \
            python-dependencies.json \
            release-commit.txt \
            release-artifacts.sha256 \
            release-manifest.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --generate-notes
