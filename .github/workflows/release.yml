name: release/github

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v1.1.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/holoforge-canva/package-lock.json
            apps/depthpop-canva/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Normalize and validate requested tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$REQUESTED_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "$normalized" != "$expected" ]; then
            echo "Requested tag must equal $expected" >&2
            exit 1
          fi
          if git rev-parse "$normalized" >/dev/null 2>&1; then
            echo "Tag already exists: $normalized" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

      - name: Verify complete application release candidate
        run: make verify-fresh

      - name: Verify container path
        run: docker build --tag canva-release-candidate:${{ github.sha }} .

      - name: Install HoloForge app
        run: npm --prefix apps/holoforge-canva ci --ignore-scripts

      - name: Install DepthPop app
        run: npm --prefix apps/depthpop-canva ci --ignore-scripts

      - name: Verify HoloForge app
        run: |
          npm --prefix apps/holoforge-canva run typecheck
          npm --prefix apps/holoforge-canva run test:coverage
          npm --prefix apps/holoforge-canva run build

      - name: Verify DepthPop app
        run: |
          npm --prefix apps/depthpop-canva run typecheck
          npm --prefix apps/depthpop-canva run test:coverage
          npm --prefix apps/depthpop-canva run build

      - name: Assemble two independent Canva distributions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-canva-apps.mjs .artifacts/canva-apps
          node --check .artifacts/canva-apps/holoforge/app.js
          node --check .artifacts/canva-apps/depthpop/app.js

          ! grep -Eiq 'DEPTHPOP|DepthPop' .artifacts/canva-apps/holoforge/preview/index.html
          ! grep -Eiq 'HoloForge' .artifacts/canva-apps/depthpop/preview/index.html

          (cd .artifacts/canva-apps/holoforge && zip -qr ../../holoforge-canva-app.zip .)
          (cd .artifacts/canva-apps/depthpop && zip -qr ../../depthpop-canva-app.zip .)

          unzip -t .artifacts/holoforge-canva-app.zip
          unzip -t .artifacts/depthpop-canva-app.zip

          unzip -Z1 .artifacts/holoforge-canva-app.zip > .artifacts/holoforge-files.txt
          unzip -Z1 .artifacts/depthpop-canva-app.zip > .artifacts/depthpop-files.txt

          for listing in .artifacts/holoforge-files.txt .artifacts/depthpop-files.txt; do
            grep -Eq '^app\.js$' "$listing"
            grep -Eq '^canva-app\.json$' "$listing"
            grep -Eq '^START-HERE\.html$' "$listing"
            grep -Eq '^preview/index\.html$' "$listing"
            grep -Eq '^PACKAGE_MANIFEST\.json$' "$listing"
          done

      - name: Retain HoloForge distribution
        uses: actions/upload-artifact@v7
        with:
          name: holoforge-canva-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: .artifacts/holoforge-canva-app.zip

      - name: Retain DepthPop distribution
        uses: actions/upload-artifact@v7
        with:
          name: depthpop-canva-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: .artifacts/depthpop-canva-app.zip

      - name: Build release evidence bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/create-release-manifest.mjs "${{ steps.release_tag.outputs.tag }}" "$GITHUB_SHA" release-manifest.json
          npm sbom --sbom-format=cyclonedx > root-sbom.cdx.json
          (
            cd apps/holoforge-canva
            npm sbom --sbom-format=cyclonedx
          ) > holoforge-canva-sbom.cdx.json
          (
            cd apps/depthpop-canva
            npm sbom --sbom-format=cyclonedx
          ) > depthpop-canva-sbom.cdx.json
          python -m pip list --format=json > python-dependencies.json
          printf '%s\n' "$GITHUB_SHA" > release-commit.txt
          sha256sum \
            root-sbom.cdx.json \
            holoforge-canva-sbom.cdx.json \
            depthpop-canva-sbom.cdx.json \
            python-dependencies.json \
            release-commit.txt \
            release-manifest.json \
            .artifacts/holoforge-canva-app.zip \
            .artifacts/depthpop-canva-app.zip \
            > release-artifacts.sha256

      - name: Verify release evidence checksums
        run: sha256sum --check release-artifacts.sha256

      - name: Retain release evidence before publication
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            root-sbom.cdx.json
            holoforge-canva-sbom.cdx.json
            depthpop-canva-sbom.cdx.json
            python-dependencies.json
            release-commit.txt
            release-manifest.json
            release-artifacts.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            .artifacts/holoforge-canva-app.zip \
            .artifacts/depthpop-canva-app.zip \
            root-sbom.cdx.json \
            holoforge-canva-sbom.cdx.json \
            depthpop-canva-sbom.cdx.json \
            python-dependencies.json \
            release-commit.txt \
            release-artifacts.sha256 \
            release-manifest.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --generate-notes
