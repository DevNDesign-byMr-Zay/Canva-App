name: React Hooks readiness
on:
  pull_request:
    paths:
      - ".github/workflows/frontend-hooks-readiness.yml"
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [holoforge-canva, depthpop-canva]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate candidate lock with pinned official Hooks plugin
        working-directory: apps/${{ matrix.app }}
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-plugin-react-hooks@7.1.1
      - name: Verify candidate locked install
        working-directory: apps/${{ matrix.app }}
        run: npm ci --ignore-scripts
      - name: Check Hooks rules without changing committed configuration
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > .hooks-readiness.config.mjs <<'CONFIG'
          import base from "./eslint.config.mjs";
          import hooks from "eslint-plugin-react-hooks";
          export default [...base, {
            files: ["**/*.{ts,tsx}"],
            plugins: { "react-hooks": hooks },
            rules: {
              "react-hooks/rules-of-hooks": "error",
              "react-hooks/exhaustive-deps": "error",
            },
          }];
          CONFIG
          ./node_modules/.bin/eslint src --config .hooks-readiness.config.mjs --max-warnings=0
      - name: Preserve candidate manifests and locks for browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hooks-candidate-${{ matrix.app }}
          retention-days: 1
          path: |
            apps/${{ matrix.app }}/package.json
            apps/${{ matrix.app }}/package-lock.json
