name: recovery/prettier

on:
  push:
    branches:
      - recover/holoforge-holographic-studio

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: recover/holoforge-holographic-studio
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Install Design Editor dependencies
        working-directory: canva-app
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier
        working-directory: canva-app
        run: npm run format
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- canva-app/src; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canva-app/src
          git commit -m "style: format locked-review coverage test"
          git push origin "HEAD:recover/holoforge-holographic-studio"
