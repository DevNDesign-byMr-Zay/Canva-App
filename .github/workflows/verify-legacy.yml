name: engineering/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=90
          python -m coverage xml -o coverage.xml
      - name: Retain Python coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage.xml

  maintained-runtime:
    name: Authenticated v115 chat runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible Node install
        run: npm ci --ignore-scripts
      - name: Audit Node dependency graph
        run: npm audit --audit-level=moderate
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: Test maintained runtime adapter with coverage
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: npm test
      - name: Retain maintained runtime V8 coverage
        uses: actions/upload-artifact@v7
        with:
          name: runtime-v8-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/v8/
      - name: Run diagnostic energy runtime demo
        run: npm run demo:energy-runtime

  design-editor-app:
    name: Canva Design Editor app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canva-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canva-app/package-lock.json
      - name: Reproducible app install
        run: npm ci --ignore-scripts
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify reviewed development-tool advisory boundary
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 0 ]; then
            echo "Full dependency graph has no moderate-or-higher advisories."
          else
            node scripts/verify-dev-audit.mjs npm-audit.json
          fi
      - name: Check Design Editor formatting
        run: npm run format:check
      - name: Type-check Design Editor app
        run: npm run typecheck
      - name: Run Design Editor app tests
        run: npm test
      - name: Build Design Editor app
        run: npm run build

  static-analysis:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Lint
        run: python -m ruff check archive_verifier scripts tests
      - name: Type-check
        run: python -m mypy archive_verifier scripts

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Audit dependencies
        run: pip-audit -r requirements.lock.txt

  archive-verification:
    name: Verify authenticated archive and app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify 84-occurrence archive
        run: python scripts/verify_legacy_archive.py
      - name: Reconstruct authenticated v115 application
        run: python scripts/materialize_v115.py
      - name: Verify committed app is deterministic
        run: git diff --exit-code -- app/authenticated-v115
      - name: Verify authenticated v115 provenance self-consistency
        run: python -m archive_verifier.provenance_integrity
      - name: Verify authenticated v115 runtime shell contract
        run: python -m archive_verifier.runtime_contract

  container-verification:
    name: Docker Compose fresh-clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate canonical Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Run maintained verifier through Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from verifier verifier
      - name: Start trusted review-context backend
        env:
          CANVA_APP_ID: ci-local-app
          CANVA_APP_ORIGIN: http://127.0.0.1:3000
          REVIEW_CONTEXT_SOURCE_URL: http://127.0.0.1:8090/scenario
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          docker compose --profile backend up --build --detach review-context
          trap 'docker compose --profile backend down --volumes --remove-orphans' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              docker compose --profile backend ps
              exit 0
            fi
            sleep 2
          done

          docker compose --profile backend logs --no-color
          exit 1
