name: Separate Canva apps

on:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/separate-canva-apps.yml"
  push:
    branches:
      - main
      - "mrzay/**"
    paths:
      - "apps/**"
      - ".github/workflows/separate-canva-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canva-frontends:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - holoforge-canva
          - depthpop-canva
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          test -s dist/app.js
          node --check dist/app.js
      - name: Retain production bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/${{ matrix.app }}/dist/app.js
            apps/${{ matrix.app }}/canva-app.json
            apps/${{ matrix.app }}/preview/index.html

  depthpop-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/depthpop-canva/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/depthpop-canva/backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile app.py test_app.py
      - name: Backend unit tests
        run: python -m pytest -q
      - name: Build backend container
        run: docker build -t depthpop-canva-backend .


  package-independent-apps:
    name: Complete independent app packages
    needs:
      - canva-frontends
      - depthpop-backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build HoloForge
        working-directory: apps/holoforge-canva
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Build DepthPop
        working-directory: apps/depthpop-canva
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Assemble complete independent packages
        run: node scripts/package-independent-canva-apps.mjs .artifacts/independent-canva-apps
      - name: Verify package entrypoints
        shell: bash
        run: |
          for app in holoforge-canva depthpop-canva; do
            root=".artifacts/independent-canva-apps/$app"
            test -s "$root/app.js"
            node --check "$root/app.js"
            test -s "$root/canva-app.json"
            test -s "$root/START-HERE.html"
            test -s "$root/preview/index.html"
          done
          test -s .artifacts/independent-canva-apps/depthpop-canva/backend/app.py
          test -s .artifacts/independent-canva-apps/depthpop-canva/backend/test_app.py
      - name: Retain HoloForge complete package
        uses: actions/upload-artifact@v7
        with:
          name: HoloForge-Canva-App-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: .artifacts/independent-canva-apps/holoforge-canva/
      - name: Retain DepthPop complete package
        uses: actions/upload-artifact@v7
        with:
          name: DepthPop-Canva-App-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: .artifacts/independent-canva-apps/depthpop-canva/
