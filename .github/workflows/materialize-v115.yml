name: materialize/v115

on:
  push:
    branches: ["main"]
    paths:
      - archive_verifier/materializer.py
      - scripts/materialize_v115.py
      - .github/workflows/materialize-v115.yml
      - legacy-html/archive/payload/**
      - provenance/DRIVE_84_MANIFEST.csv
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: materialize-authenticated-v115
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Materialize authenticated application
        run: python scripts/materialize_v115.py

      - name: Verify authenticated archive and materialized bytes
        run: |
          python -m archive_verifier
          python -m archive_verifier.provenance_integrity
          python -m archive_verifier.runtime_contract

      - name: Publish reviewed materialization change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/materialize-authenticated-v115"

          git add -- app/authenticated-v115
          if git diff --cached --quiet; then
            echo "Authenticated v115 application is already materialized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "build: materialize authenticated v115 application"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
          fi
          git push --force-with-lease origin HEAD:"$branch"

          pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body="Deterministic authenticated v115 materialization generated from current main. Archive verification, provenance integrity, and runtime-contract checks passed before this branch was published. Normal pull-request CI and CodeQL must still pass before merge."

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Review authenticated v115 materialization" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Review authenticated v115 materialization" --body "$body"
          fi
