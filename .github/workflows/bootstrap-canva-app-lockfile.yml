name: Bootstrap Canva app lockfile

on:
  push:
    branches:
      - "mrzay/canva-app-reproducible-install-v1"
    paths:
      - "canva-app/package.json"
      - ".github/workflows/bootstrap-canva-app-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: canva-app-lock-bootstrap
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: canva-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mrzay/canva-app-reproducible-install-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile
        working-directory: .
        run: |
          if git diff --quiet -- canva-app/package-lock.json && git ls-files --error-unmatch canva-app/package-lock.json >/dev/null 2>&1; then
            echo "Canva app lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canva-app/package-lock.json
          git commit -m "build(canva-app): lock SDK workspace dependencies"
          git pull --rebase origin mrzay/canva-app-reproducible-install-v1
          git push origin HEAD:mrzay/canva-app-reproducible-install-v1
